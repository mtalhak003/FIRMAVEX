name: Desktop distribution candidates
on:
  push:
    branches: ["product/desktop-batch3", "product/desktop-batch4", "product/desktop-batch5"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Qt host libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - run: python -m pip install ".[desktop,dev]" "pyinstaller==6.16.0"
      - run: python -m PyInstaller --clean --noconfirm packaging/desktop.spec
      - name: Record actual application identities
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            python tools/desktop_distribution_manifest.py dist/FIRMAVEX.app
          else
            python tools/desktop_distribution_manifest.py dist/FIRMAVEX
          fi
      - name: Linux installed application smoke
        if: runner.os == 'Linux'
        run: dist/FIRMAVEX/FIRMAVEX-Desktop --smoke-test
      - name: Linux frozen actual ARM execution
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install --no-install-recommends -y gcc-arm-none-eabi qemu-system-arm gdb-multiarch
          dist/FIRMAVEX/FIRMAVEX --firmavex-cli demo --output-dir "$RUNNER_TEMP/frozen-firmware-demo"
          dist/FIRMAVEX/FIRMAVEX --firmavex-cli inspect "$RUNNER_TEMP/frozen-firmware-demo/search"
          python -m tools.desktop_native_evidence "$RUNNER_TEMP/frozen-firmware-demo"
      - name: Windows installed application smoke
        if: runner.os == 'Windows'
        run: dist/FIRMAVEX/FIRMAVEX-Desktop.exe --smoke-test
      - name: macOS installed application smoke
        if: runner.os == 'macOS'
        run: dist/FIRMAVEX.app/Contents/MacOS/FIRMAVEX-Desktop --smoke-test
      - name: Windows unsigned installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows install upgrade uninstall (host GUI only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/test_windows_install.ps1
      - name: macOS unnotarized DMG
        if: runner.os == 'macOS'
        run: hdiutil create -volname FIRMAVEX -srcfolder dist/FIRMAVEX.app -ov -format UDZO dist/FIRMAVEX-macOS-unnotarized.dmg
      - name: Linux Debian package
        if: runner.os == 'Linux'
        run: python -m tools.build_linux_deb dist/FIRMAVEX dist/FIRMAVEX-Linux-amd64.deb
      - name: Linux portable application
        if: runner.os == 'Linux'
        run: tar -C dist -czf dist/FIRMAVEX-Linux-portable.tar.gz FIRMAVEX
      - name: Checksums
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, pathlib
          root = pathlib.Path('dist')
          files = sorted(p for p in root.iterdir() if p.is_file() and p.suffix in {'.exe', '.dmg', '.gz', '.deb'})
          (root/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in files))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: FIRMAVEX-${{ matrix.os }}-unsigned-candidate
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error
  macos-firmware-qualification:
    name: macOS ARM firmware qualification candidate
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install native runtime candidates
        run: brew install qemu gdb arm-none-eabi-gcc
      - run: python -m pip install ".[dev,desktop]" "pyinstaller==6.16.0"
      - name: Probe native capabilities and execute actual firmware
        run: |
          mkdir -p "$RUNNER_TEMP/arm-gdb"
          ln -s "$(command -v gdb)" "$RUNNER_TEMP/arm-gdb/arm-none-eabi-gdb"
          export PATH="$RUNNER_TEMP/arm-gdb:$PATH"
          firmavex doctor
          firmavex demo --output-dir "$RUNNER_TEMP/native-arm-demo"
          firmavex inspect "$RUNNER_TEMP/native-arm-demo/search"
          python -m tools.desktop_native_evidence "$RUNNER_TEMP/native-arm-demo"
      - name: Frozen Apple Silicon application firmware workflow
        run: |
          export PATH="$RUNNER_TEMP/arm-gdb:$PATH"
          python -m PyInstaller --clean --noconfirm packaging/desktop.spec
          dist/FIRMAVEX.app/Contents/MacOS/FIRMAVEX --firmavex-cli demo --output-dir "$RUNNER_TEMP/mac-frozen-demo"
          python -m tools.desktop_native_evidence "$RUNNER_TEMP/mac-frozen-demo"
      - name: Preserve frozen macOS execution records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-frozen-firmware-evidence
          path: ${{ runner.temp }}/mac-frozen-demo
          if-no-files-found: warn
      - name: Preserve real execution records even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-native-ARM-qualification-evidence
          path: ${{ runner.temp }}/native-arm-demo
          if-no-files-found: warn
  windows-firmware-candidate:
    name: Windows native ARM adapter qualification candidate
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      FIRMAVEX_REQUIRE_RUNTIME: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
      - name: Install signed native runtime packages
        shell: msys2 {0}
        run: |
          log=/tmp/firmavex-runtime-install.log
          if ! pacman -S --needed --noconfirm mingw-w64-ucrt-x86_64-qemu mingw-w64-ucrt-x86_64-gdb-multiarch mingw-w64-ucrt-x86_64-arm-none-eabi-gcc >"$log" 2>&1; then
            tail -n 30 "$log" | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              printf '::error title=Signed runtime package installation::%s\n' "$line"
            done
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev,desktop,gui-test]" "pyinstaller==6.16.0"
      - name: Probe signed-feed native runtime candidates
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        shell: pwsh
        run: |
          $env:PATH = (Join-Path $env:MSYS2_LOCATION "ucrt64\bin") + ";" + $env:PATH
          & "$env:pythonLocation\python.exe" -m tools.desktop_runtime_probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real ARM adapter and cancellation tests
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        shell: pwsh
        run: |
          $env:PATH = (Join-Path $env:MSYS2_LOCATION "ucrt64\bin") + ";" + $env:PATH
          & "$env:pythonLocation\python.exe" tools/product_ci_tests.py -q tests/product/test_runtime.py -k actual_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualified Windows supervised real firmware demonstration
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:PATH = (Join-Path $env:MSYS2_LOCATION "ucrt64\bin") + ";" + $env:PATH
          & "$env:pythonLocation\python.exe" -m tools.desktop_ci_demo --output-dir "$env:RUNNER_TEMP/windows-native-demo"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:pythonLocation\python.exe" -m tools.desktop_native_evidence "$env:RUNNER_TEMP/windows-native-demo"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Archive native Windows firmware evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-native-supervised-firmware-evidence
          path: ${{ runner.temp }}/windows-native-demo
          if-no-files-found: warn
      - name: Native Windows real desktop cancellation and export workflow
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:PATH = (Join-Path $env:MSYS2_LOCATION "ucrt64\bin") + ";" + $env:PATH
          & "$env:pythonLocation\python.exe" tools/product_ci_tests.py -q tests/desktop/test_real_firmware.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frozen Windows actual ARM workflow
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          & "$env:pythonLocation\python.exe" -m PyInstaller --clean --noconfirm packaging/desktop.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = (Join-Path $env:MSYS2_LOCATION "ucrt64\bin") + ";" + $env:PATH
          & dist/FIRMAVEX/FIRMAVEX.exe --firmavex-cli demo --output-dir "$env:RUNNER_TEMP/windows-frozen-demo"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:pythonLocation\python.exe" -m tools.desktop_native_evidence "$env:RUNNER_TEMP/windows-frozen-demo"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Archive frozen Windows firmware evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-frozen-firmware-evidence
          path: ${{ runner.temp }}/windows-frozen-demo
          if-no-files-found: warn
