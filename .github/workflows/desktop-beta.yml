name: Desktop beta native setup qualification
on:
  push:
    branches: ["product/desktop-batch4", "product/desktop-batch5", "product/desktop-batch6", "product/desktop-batch7", "product/desktop-batch8", "product/desktop-batch9", "product/desktop-batch10", "product/desktop-batch11"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-provider:
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      QT_QPA_PLATFORM: offscreen
      FIRMAVEX_REQUIRE_RUNTIME: "1"
      FIRMAVEX_WORKER_DIAGNOSTICS: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - shell: bash
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r packaging/build-requirements.lock
          python -m pip install --no-deps --no-build-isolation .
          python -m tools.check_build_inputs
      - name: Install publisher runtime in private storage with spaces
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'FIRMAVEX user with spaces'
          "LOCALAPPDATA=$env:LOCALAPPDATA" >> $env:GITHUB_ENV
          python -m tools.desktop_setup_ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compiler-free actual firmware and native GUI
        shell: pwsh
        run: |
          python -m tools.desktop_ci_demo --builtin --output-dir "$env:RUNNER_TEMP/windows-builtin-demo"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.desktop_native_evidence "$env:RUNNER_TEMP/windows-builtin-demo"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/product_ci_tests.py -q tests/desktop/test_real_builtin.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frozen GUI and console worker compiler-free execution
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm packaging/desktop.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $p = Start-Process dist/FIRMAVEX/FIRMAVEX-Desktop.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Frozen GUI startup failed' }
          & dist/FIRMAVEX/FIRMAVEX.exe --firmavex-cli demo-builtin --output-dir "$env:RUNNER_TEMP/windows-frozen-builtin"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.desktop_native_evidence "$env:RUNNER_TEMP/windows-frozen-builtin"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          firmavex runtime-history
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installer real firmware and data preservation
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./packaging/test_windows_install.ps1 -FirmwareQualification
          firmavex runtime-history
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain sanitized installation diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-runtime-installation-diagnostics
          path: ${{ runner.temp }}/FIRMAVEX user with spaces/FIRMAVEX/installation-diagnostics/runtime-setup-*.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Windows-beta-compiler-free-execution-evidence
          path: |
            ${{ runner.temp }}/windows-builtin-demo
            ${{ runner.temp }}/windows-frozen-builtin
            ${{ runner.temp }}/windows-installed-builtin
            ${{ runner.temp }}/installer-lifecycle.json
          if-no-files-found: warn
  compiler-free:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      FIRMAVEX_REQUIRE_RUNTIME: "1"
      FIRMAVEX_WORKER_DIAGNOSTICS: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Linux distro runtime without ARM compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm gdb-multiarch libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Apple Silicon runtime without ARM compiler
        if: runner.os == 'macOS'
        run: brew install qemu gdb
      - shell: bash
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r packaging/build-requirements.lock
          python -m pip install --no-deps --no-build-isolation .
          python -m tools.check_build_inputs
      - name: Real compiler-free GUI execution reproduction cancellation and export
        run: python tools/product_ci_tests.py -q tests/desktop/test_real_builtin.py
      - run: python -m PyInstaller --clean --noconfirm packaging/desktop.spec
      - name: Frozen compiler-free firmware evidence
        shell: bash
        run: |
          app=dist/FIRMAVEX/FIRMAVEX
          if [ "${{ runner.os }}" = "macOS" ]; then app=dist/FIRMAVEX.app/Contents/MacOS/FIRMAVEX; fi
          "$app" --firmavex-cli demo-builtin --output-dir "$RUNNER_TEMP/beta-frozen-demo"
          python -m tools.desktop_native_evidence "$RUNNER_TEMP/beta-frozen-demo"
      - name: Linux package installation upgrade removal preserves data
        if: runner.os == 'Linux'
        run: |
          python -m tools.build_linux_deb dist/FIRMAVEX dist/FIRMAVEX-Linux-amd64.deb
          mkdir -p "$HOME/.local/share/FIRMAVEX/install-preservation"
          printf 'preserve user-owned results\n' > "$HOME/.local/share/FIRMAVEX/install-preservation/sentinel"
          sudo apt-get install -y ./dist/FIRMAVEX-Linux-amd64.deb
          env PATH=/nonexistent /opt/firmavex/FIRMAVEX-Desktop --smoke-test
          sha256sum "$RUNNER_TEMP/beta-frozen-demo/search/result.json" "$RUNNER_TEMP/beta-frozen-demo/search/run.sqlite3" > "$RUNNER_TEMP/saved-result.sha256"
          sudo dpkg -i dist/FIRMAVEX-Linux-amd64.deb
          env PATH=/nonexistent /opt/firmavex/FIRMAVEX-Desktop --smoke-test
          /opt/firmavex/FIRMAVEX --firmavex-cli inspect "$RUNNER_TEMP/beta-frozen-demo/search"
          sha256sum -c "$RUNNER_TEMP/saved-result.sha256"
          sudo apt-get remove -y firmavex-desktop
          sha256sum -c "$RUNNER_TEMP/saved-result.sha256"
          test -f "$HOME/.local/share/FIRMAVEX/install-preservation/sentinel"
          test ! -e /opt/firmavex/FIRMAVEX-Desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ${{ matrix.os }}-beta-compiler-free-evidence
          path: ${{ runner.temp }}/beta-frozen-demo
          if-no-files-found: warn
