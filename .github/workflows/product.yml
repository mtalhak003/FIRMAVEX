name: Product foundation

on:
  push:
    branches: ["product/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-unit:
    name: Product unit / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install product and development dependencies
        run: python -m pip install ".[dev]"
      - name: Exercise platform-neutral product behavior
        # These selected modules use synthetic observations and ordinary host
        # subprocesses. They do not establish native firmware support.
        run: >-
          python -m pytest -q
          tests/product/test_config.py
          tests/product/test_protocol.py
          tests/product/test_worker.py
          tests/product/test_supervisor.py
          tests/product/test_cli.py
          tests/product/test_store.py
          tests/product/test_example.py
          tests/product/test_tools.py
      - name: Exercise debugger parsing and host cleanup without firmware
        # Actual ARM tests are intentionally reserved for the Ubuntu tool job.
        run: python -m pytest -q tests/product/test_runtime.py -k "not actual_"
      - name: Validate packaging
        run: python -m build

  linux-real-firmware:
    name: Ubuntu / real product firmware and existing regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install actual ARM runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc gcc-arm-none-eabi qemu-system-arm gdb-multiarch
      - name: Create isolated environment and install
        run: |
          python -m venv "$RUNNER_TEMP/firmavex-venv"
          "$RUNNER_TEMP/firmavex-venv/bin/python" -m pip install ".[dev]"
          # Existing research tests still resolve this executable name.
          ln -s "$(command -v gdb-multiarch)" "$RUNNER_TEMP/firmavex-venv/bin/arm-none-eabi-gdb"
      - name: Probe selected runtime capabilities
        run: |
          "$RUNNER_TEMP/firmavex-venv/bin/firmavex" doctor
      - name: Execute product tests using real firmware tools
        run: |
          export PATH="$RUNNER_TEMP/firmavex-venv/bin:$PATH"
          python -m pytest -q tests/product
      - name: Preserve existing research behavior
        # This runs regression tests, never the controlled evaluation campaign.
        run: |
          export PATH="$RUNNER_TEMP/firmavex-venv/bin:$PATH"
          python -m pytest -q tests --ignore=tests/product
      - name: Demonstrate installed CLI outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/firmavex-venv/bin/firmavex" demo --output-dir "$RUNNER_TEMP/firmavex-product-demo"
          "$RUNNER_TEMP/firmavex-venv/bin/firmavex" inspect "$RUNNER_TEMP/firmavex-product-demo/search"
      - name: Whitespace check
        run: git diff --check
