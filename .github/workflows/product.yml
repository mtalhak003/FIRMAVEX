name: Product desktop and engine

on:
  push:
    branches: ["product/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-unit:
    name: Product and desktop / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_QT_API: pyside6
      FIRMAVEX_CI_DIAGNOSTICS: ${{ github.workspace }}/firmavex-ci-diagnostics
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux Qt host libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 bubblewrap
      - name: Install product, desktop, and test dependencies
        shell: bash
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r packaging/build-requirements.lock
          python -m pip install --no-deps --no-build-isolation .
          python -m tools.check_build_inputs
      - name: Exercise platform-neutral product behavior
        timeout-minutes: 6
        # These selected modules use synthetic observations and ordinary host
        # subprocesses. They do not establish native firmware support.
        run: >-
          python tools/product_ci_tests.py --ci-watchdog -q
          tests/backends/test_qualification.py
          tests/product/test_local_interface.py
          tests/product/test_ci_diagnostics.py
          tests/product/test_compiler_diagnostics.py
          tests/product/test_arm_reproduction_summary.py
          tests/product/test_desktop_workflow.py
          tests/product/test_recents.py tests/product/test_run_review.py
          tests/product/test_verification.py tests/product/test_workspace.py tests/product/test_regression.py tests/product/test_regression_review.py
          tests/product/test_release.py
          tests/product/test_release_bundle.py tests/product/test_frozen_inventory.py tests/product/test_build_inputs.py tests/product/test_payload_inventory.py tests/product/test_component_inventory.py tests/product/test_artifact_signature.py tests/product/test_release_attestation.py tests/product/test_versioned_install_ci.py tests/product/test_aggregate_isolation_probe.py tests/product/test_namespace_diagnostics.py
          tests/product/test_config.py
          tests/product/test_protocol.py
          tests/product/test_worker.py
          tests/product/test_supervisor.py
          tests/product/test_cli.py
          tests/product/test_store.py
          tests/product/test_example.py
          tests/product/test_bundled_example.py
          tests/product/test_runtime_setup.py
          tests/product/test_tools.py
          tests/product/test_runtime_pack.py
          tests/product/test_platform_support.py
          tests/product/test_file_state.py
          tests/product/test_services.py
          tests/product/test_windows_job.py
      - name: Assess Linux isolation feasibility without admitting workloads
        if: runner.os == 'Linux'
        run: python -m tools.isolation_feasibility --output isolation-feasibility.json
      - name: Retain isolation assessment including blockers
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: isolation-feasibility-py${{ matrix.python }}
          path: isolation-feasibility.json
          if-no-files-found: error
      - name: Publish platform-neutral timeout diagnostics
        if: always()
        run: python tools/product_ci_tests.py --report-diagnostics
      - name: Retain platform-neutral diagnostics immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-neutral-diagnostics-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ github.workspace }}/firmavex-ci-diagnostics
          if-no-files-found: warn
          retention-days: 14
      - name: Exercise debugger parsing and host cleanup without firmware
        # Actual ARM tests are intentionally reserved for the Ubuntu tool job.
        run: python tools/product_ci_tests.py -q tests/product/test_runtime.py -k "not actual_"
      - name: Validate packaging
        run: python -m build
      - name: Exercise installed packaging outside checkout
        run: python tools/product_ci_tests.py -q tests/product/test_packaging.py
      - name: Exercise desktop with synthetic workers
        # Qt and host-process tests are not native ARM runtime qualification.
        run: python tools/product_ci_tests.py -q tests/desktop -k "not real_desktop"
      - name: Smoke-test installed desktop without firmware dispatch
        run: firmavex-desktop --smoke-test
      - name: Publish bounded native timeout diagnostics
        if: always()
        run: python tools/product_ci_tests.py --report-diagnostics
      - name: Retain regression diagnostics even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-diagnostics-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ github.workspace }}/firmavex-ci-diagnostics
          if-no-files-found: warn
          retention-days: 14

  linux-real-firmware:
    name: Ubuntu / real product firmware and existing regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_QT_API: pyside6
      FIRMAVEX_CI_DIAGNOSTICS: ${{ github.workspace }}/firmavex-ci-diagnostics
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install actual ARM runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc gcc-arm-none-eabi qemu-system-arm gdb-multiarch libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 bubblewrap
      - name: Create isolated environment and install
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/firmavex-venv"
          "$RUNNER_TEMP/firmavex-venv/bin/python" -m pip install --only-binary=:all: --require-hashes -r packaging/build-requirements.lock
          "$RUNNER_TEMP/firmavex-venv/bin/python" -m pip install --no-deps --no-build-isolation .
          "$RUNNER_TEMP/firmavex-venv/bin/python" -m tools.check_build_inputs
          # Existing research tests still resolve this executable name.
          ln -s "$(command -v gdb-multiarch)" "$RUNNER_TEMP/firmavex-venv/bin/arm-none-eabi-gdb"
      - name: Probe selected runtime capabilities
        run: |
          "$RUNNER_TEMP/firmavex-venv/bin/firmavex" doctor
      - name: Execute product tests using real firmware tools
        run: |
          export PATH="$RUNNER_TEMP/firmavex-venv/bin:$PATH"
          FIRMAVEX_REQUIRE_RUNTIME=1 python tools/product_ci_tests.py -q tests/product
          FIRMAVEX_REQUIRE_RUNTIME=1 python tools/product_ci_tests.py -q tests/desktop
      - name: Preserve existing research behavior
        # This runs regression tests, never the controlled evaluation campaign.
        run: |
          export PATH="$RUNNER_TEMP/firmavex-venv/bin:$PATH"
          python tools/product_ci_tests.py -q tests --ignore=tests/product --ignore=tests/desktop
      - name: Demonstrate installed CLI outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/firmavex-venv/bin/firmavex" demo --output-dir "$RUNNER_TEMP/firmavex-product-demo"
          "$RUNNER_TEMP/firmavex-venv/bin/firmavex" inspect "$RUNNER_TEMP/firmavex-product-demo/search"
      - name: Whitespace check
        run: git diff --check
      - name: Publish bounded native timeout diagnostics
        if: always()
        run: python tools/product_ci_tests.py --report-diagnostics
      - name: Retain real regression diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-diagnostics-linux-real
          path: ${{ github.workspace }}/firmavex-ci-diagnostics
          if-no-files-found: warn
          retention-days: 14
