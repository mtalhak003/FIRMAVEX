name: Universal backend foundation
on:
  push:
    branches: ["product/desktop-batch5"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FIRMAVEX_REQUIRE_BACKENDS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y iverilog gcc-riscv64-unknown-elf qemu-system-misc qemu-system-arm gdb-multiarch
      - run: sudo ln -s /usr/bin/gdb-multiarch /usr/local/bin/arm-none-eabi-gdb
      - run: python -m pip install ".[dev]"
      - run: python tools/product_ci_tests.py -q tests/backends
      - name: Independent real examples and reports
        run: |
          python -m firmavex.backends.cli prepare-example riscv32-virt --output "$RUNNER_TEMP/rv-build"
          python -m firmavex.backends.cli execute riscv32-virt "$RUNNER_TEMP/rv-build/firmware.elf" --values 2 1 --output "$RUNNER_TEMP/rv-run"
          python -m firmavex.backends.cli reproduce "$RUNNER_TEMP/rv-run" --output "$RUNNER_TEMP/rv-replay"
          python -m firmavex.backends.cli export "$RUNNER_TEMP/rv-run" --output "$RUNNER_TEMP/rv-report"
          python -m firmavex.backends.cli prepare-example verilog-icarus --output "$RUNNER_TEMP/hdl-build"
          python -m firmavex.backends.cli execute verilog-icarus "$RUNNER_TEMP/hdl-build/counter.v" --output "$RUNNER_TEMP/hdl-run"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-linux-backend-evidence
          path: |
            ${{ runner.temp }}/rv-build
            ${{ runner.temp }}/rv-run
            ${{ runner.temp }}/rv-replay
            ${{ runner.temp }}/rv-report
            ${{ runner.temp }}/hdl-build
            ${{ runner.temp }}/hdl-run
  contract:
    strategy:
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev]"
      # These are record/validation tests, not native firmware qualification.
      - run: python tools/product_ci_tests.py -q tests/backends -k "invalid_limit or invalid_vector or profiles_are_distinct or fresh_directory_only or missing_source or unknown_accounting or reject_non_riscv or reject_external_hdl or interruption_persisted or cleanup_error_does_not_replace or reject_unowned_artifacts"
