[build-system]
requires = ["setuptools>=77,<85", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "firmavex-desktop"
version = "0.3.0.dev1"
description = "Desktop firmware testing using QEMU and an ARM-capable GDB"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Muhammad Talha Khan"}]
dependencies = ["pyelftools>=0.32,<1"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2", "setuptools>=77,<85", "wheel>=0.45,<1"]
desktop = ["PySide6==6.11.1"]
gui-test = ["PySide6==6.11.1", "pytest-qt>=4.4,<5"]

[project.scripts]
firmavex = "firmavex.product.cli:main"
firmavex-backend = "firmavex.backends.cli:main"
firmavex-desktop = "firmavex.desktop.app:main"

[project.urls]
Repository = "https://github.com/mtalhak003/FIRMAVEX"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
namespaces = true
include = [
    "firmavex", "firmavex.*",
    "src", "src.firmavex", "src.firmavex.*",
    "firmware", "firmware.benchmarks", "firmware.benchmarks.cortex_m",
]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
"firmavex.backends" = ["examples/*.c", "examples/*.S", "examples/*.ld", "examples/*.v"]
"firmavex.product" = ["resources/example/*.c", "resources/example/*.ld", "resources/example/*.md", "resources/example/*.json"]
"firmware.benchmarks.cortex_m" = [
    "*.c", "*.ld", "README.md",
    "corpus/*.c", "corpus/manifest.json",
    "corpus_v2/*.c", "corpus_v2/manifest.json",
]
